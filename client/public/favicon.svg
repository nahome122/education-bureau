<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Green rounded background -->
  <rect width="64" height="64" rx="14" ry="14" fill="#2e7d32"/>

  <!-- Graduation cap (mortarboard) -->
  <!-- Cap top flat board -->
  <polygon points="32,12 54,22 32,32 10,22" fill="white"/>
  <!-- Cap crown bump -->
  <rect x="29" y="12" width="6" height="5" rx="1" fill="white"/>
  <!-- Tassel string -->
  <line x1="54" y1="22" x2="54" y2="32" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="54" cy="33" r="2" fill="white"/>

  <!-- Open book / chevron shape below cap -->
  <path d="M18,34 L32,44 L46,34 L46,40 L32,50 L18,40 Z" fill="white"/>
  <path d="M18,34 L32,40 L46,34" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
</svg>
